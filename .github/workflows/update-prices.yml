name: 부품 가격 자동 갱신

# 매일 06:00 KST(21:00 UTC)에 시세를 받아 pc/js/prices.js 를 갱신한다.
# 저장소 Settings → Secrets 에 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 을 등록해야 동작하며,
# 키가 없으면 아무것도 하지 않고 정상 종료한다.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 가격 선정 로직 테스트
        run: node --test scripts/price-pick.test.mjs

      - name: 시세 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/update-prices.mjs

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- pc/js/prices.js; then
            echo "가격 변동이 없어 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc/js/prices.js
          git commit -m "부품 가격 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
